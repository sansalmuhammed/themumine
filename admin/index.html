<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — The Mumine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>The Mumine Admin</h1>
      <p>Site içeriğini düzenlemek için kullanıcı adı ve şifre ile giriş yapın.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input type="text" id="username" name="username" required autocomplete="username" inputmode="email">
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" style="width:100%;margin-top:0.5rem">Giriş</button>
        <p id="login-error" class="hint" style="color:#fca5a5;display:none"></p>
      </form>
    </div>
  </div>

  <div id="admin-app" class="admin-app">
    <aside class="admin-sidebar">
      <div class="admin-brand">The Mumine CMS</div>
      <nav class="admin-nav" id="admin-nav">
        <button type="button" data-section="site" class="is-active">Site &amp; Tema</button>
        <button type="button" data-section="home">Ana Sayfa</button>
        <button type="button" data-section="works">Selected Works</button>
        <button type="button" data-section="projects">Projeler</button>
        <button type="button" data-section="thinking">Yazılar Listesi</button>
        <button type="button" data-section="articles">Makaleler</button>
        <button type="button" data-section="about">Hakkımda</button>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html" target="_blank" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;margin-bottom:0.5rem">Siteyi görüntüle</a>
        <button type="button" id="logout-btn" class="btn btn-secondary btn-sm" style="width:100%">Çıkış</button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h2 id="section-title">Site &amp; Tema</h2>
        <button type="button" id="save-btn" class="btn">Kaydet</button>
      </header>
      <div class="admin-content" id="admin-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/admin.js"></script>
</body>
</html>
